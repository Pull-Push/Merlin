{% extends "base.html" %}
{% block content %}

<div class="room-page">

    <!-- Cipher Key Panel -->
    <aside class="key-panel">
        <div class="key-panel-header">
            <span class="key-glyph">⚷</span>
            <span>Cipher Keys</span>
        </div>
        <div class="key-fields">
            <input type="number" id="shift" placeholder="Shift" title="Numeric shift value">
            <input type="text"   id="seed1" placeholder="Code Word 1">
            <input type="text"   id="seed2" placeholder="Code Word 2">
            <input type="text"   id="seed3" placeholder="Code Word 3">
        </div>
        <p class="key-hint">All participants must use identical keys to decrypt messages.</p>
    </aside>

    <!-- Chat Area -->
    <div class="chat-area">
        <div class="chat-header">
            <span class="room-label">Room</span>
            <strong class="room-code">{{ room }}</strong>
        </div>

        <!-- Messages -->
        <div class="messages" id="messages"></div>

        <!-- Decrypted output bar -->
        <div class="decrypt-bar" id="lower">
            <span class="decrypt-hint">↑ Click any encrypted message to reveal it here</span>
        </div>

        <!-- Encrypted message input -->
        <div class="input-row">
            <input type="text" id="toenc" placeholder="Type a secret message…">
            <button class="btn-merlin btn-sm" onclick="encrypt()">Send Encrypted</button>
        </div>

        <!-- Clear message input -->
        <div class="input-row input-row-clear">
            <input type="text" id="message" placeholder="Send in the clear…">
            <button class="btn-merlin btn-sm btn-outline" onclick="sendMessage()">Send Clear</button>
        </div>
    </div>
</div>

{# Room history, read by sockscript.js on load. Not executable JS, so editors won't flag it. #}
<script type="application/json" id="history-data">{{ messages | tojson }}</script>

<script src="{{ url_for('static', filename='js/sockscript.js') }}"></script>

{% endblock %}
