{% extends "base.html" %}
{% block content %}

<div class="lobby-page">
    <div class="lobby-card">
        <div class="lobby-glyph">⟁</div>
        <h2 class="lobby-title">Enter a Chamber</h2>

        {% if error %}
        <div class="flash flash-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/dashboard">
            <div class="field">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" value="{{ name or '' }}" placeholder="What shall we call you?" required>
            </div>
            <div class="field">
                <label for="code">Room Code</label>
                <input type="text" id="code" name="code" value="{{ code or '' }}" placeholder="4-letter code" maxlength="4" style="text-transform:uppercase">
            </div>

            <div class="lobby-actions">
                <button class="btn-merlin btn-outline" type="submit" name="join">Join Room</button>
                <button class="btn-merlin" type="submit" name="create">Create Room</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
