{% extends "base.html" %}
{% block content %}

<div class="landing-page">
    <div class="landing-glyph">⟁</div>
    <h1 class="landing-title">MERLIN</h1>
    <p class="landing-sub">Encrypted chat for those who value their secrets.</p>

    <div class="auth-panels">
        <!-- Login -->
        <div class="panel">
            <h2 class="panel-title">Sign In</h2>
            <form action="/login/user" method="POST">
                <div class="field">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" placeholder="your@email.com" required>
                </div>
                <div class="field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                </div>
                <button class="btn-merlin" type="submit">Enter</button>
            </form>
        </div>

        <div class="panel-divider">or</div>

        <!-- Register -->
        <div class="panel">
            <h2 class="panel-title">Create Account</h2>
            <form action="/new/user" method="POST">
                <div class="field">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" name="username" placeholder="Choose a name" required>
                </div>
                <div class="field">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" name="email" placeholder="your@email.com" required>
                </div>
                <div class="field">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" name="password" placeholder="Min. 8 characters" required>
                </div>
                <div class="field">
                    <label for="reg-conf">Confirm Password</label>
                    <input type="password" id="reg-conf" name="conf_pass" placeholder="Repeat password" required>
                </div>
                <button class="btn-merlin" type="submit">Register</button>
            </form>
        </div>
    </div>

    <a href="/dashboard" class="skip-link">Skip to chat →</a>
</div>

{% endblock %}
